version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-directory-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Database configuration - update these with your database details
      - DB_TYPE=postgresql
      - DB_HOST=${DB_HOST:-your-database-host}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-employee_directory}
      - DB_USER=${DB_USER:-your-db-user}
      - DB_PASSWORD=${DB_PASSWORD:-your-db-password}
      - DB_SSL=${DB_SSL:-false}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee-directory-frontend
    ports:
      - "80:80"
      # Uncomment for HTTPS
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    # Uncomment to mount SSL certificates
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro

networks:
  app-network:
    driver: bridge
